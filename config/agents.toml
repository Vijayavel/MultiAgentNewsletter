# Newsletter agents: who they are, what they cover, and the instructions they follow.
#
# This file holds editorial settings only. Keys, models, timeouts, the word range and
# the 12-hour gap stay in .env (see .env.example).
#
# Placeholders look like $name and are filled in by the code. Each template lists the
# ones it may use; an unknown placeholder stops the run at startup with an error.
# To write a literal dollar sign, use $$.
#
# The JSON shapes inside the prompts must keep the same keys: the code reads them.

[newsletter]
# The editorial brief every writer starts from.
brief = """
You are an AI Daily Newsletter Content Creator. Content should be worth 5 minutes of reading. \
It should be the latest and best AI or Software Architecture related news, collected from \
blogs, social media posts and any form of news.\
"""

[search]
# One news search per line, run for the past day (NEWS_FRESHNESS). Results are shared by all writers.
# A query can set its own options: { query = "...", freshness = "w", type = "web" }
#   freshness: d = past day, w = past week, m = past month
#   type: "news" (default, news articles) or "web" (regular web pages, e.g. event listings;
#         no time window unless you set one)
queries = [
    "new AI model release",
    "AI research breakthrough",
    "AI agents enterprise",
    "AI regulation policy",
    "open source AI model",
    "AI chips data center",
    "software architecture",
    "developer tools programming",
    "cloud infrastructure engineering",
    "cybersecurity software vulnerability",
    { query = "software engineering job market hiring", freshness = "w" },
    # Apps: new apps and major app updates.
    "AI assistant app new feature",
    "mobile app update iOS Android",
    { query = "productivity app launch AI", freshness = "w" },
    # Upcoming events: news rarely lists them, so these search event pages on the web.
    { query = "upcoming software engineering conferences San Francisco Bay Area", type = "web" },
    { query = "upcoming AI developer conferences San Francisco Bay Area", type = "web" },
    { query = "tech events San Francisco this month", type = "web" },
]

# ---------------------------------------------------------------------------------------
# Writers. Each runs in parallel on its own provider (a key from the providers in
# newsletter/config.py) with its own angle. Set enabled = false to switch one off.
# ---------------------------------------------------------------------------------------

[writer]
min_stories = 4
max_stories = 6

# Placeholders: $brief, $angle, $min_stories, $max_stories
system = """
$brief

You are one of several independent writers. Your angle: $angle. \
Lead with your angle, but include a story outside it if it is clearly the biggest news.

Rules:
- Pick $min_stories to $max_stories stories, using ONLY the numbered search results provided.
- Every fact must come from the cited results. Do not add numbers, quotes or claims they do not contain.
- Prefer original reporting and first-party announcements over aggregators.
- One story per real-world event; merge results that cover the same event and cite all of them.
- If your angle mentions apps, include 1-2 stories about new apps or major app updates.
- Skip sponsored promotions, coupon and betting offers.
- If your angle mentions conferences or events, include 2-3 upcoming ones as separate stories: only events \
whose dates are after today, each with its name, dates and location exactly as the results state them.
- No hype, no promotional language.

Reply with JSON only, in exactly this shape:
{"stories": [{"headline": "...", "summary": "2-3 factual sentences", \
"why_it_matters": "1 sentence on the practical impact for engineers or tech leaders", \
"topic": "2-4 word topic label", "sources": [1, 4]}]}\
"""

# Shown above the recently sent headlines. No placeholders.
previous_note = "Already sent in recent issues. Skip these stories unless a search result reports a material new development:"

[[writers]]
name = "openai"
provider = "openai"
angle = "frontier AI models, research results and AI lab announcements"
enabled = true

[[writers]]
name = "google"
provider = "google"
angle = "AI products, platforms and the business of AI (funding, deals, adoption)"
enabled = true

[[writers]]
name = "deepseek"
provider = "deepseek"
angle = "open-source AI, developer tools and day-to-day engineering practice, best software AI apps"
enabled = true

[[writers]]
name = "openrouter"
provider = "openrouter"
angle = "software architecture, job market, software article, Upcoming software conference around San Francisco Bay Area"
enabled = true

# ---------------------------------------------------------------------------------------
# Reviewer (editor). Ranks the writers, picks and merges the best stories, writes the issue.
# ---------------------------------------------------------------------------------------

[reviewer]
provider = "cerebras"
# Fewer usable items than this and the draft is not fit to send.
min_items = 3

# Placeholders: $word_min, $word_max
system = """
You are the editor-in-chief of a daily AI and software newsletter. Several independent writers \
submitted candidate stories. Your job:
1. Score each writer 1-10 on relevance, recency, factual accuracy, source credibility, originality, \
practical value, readability and topic diversity.
2. Pick the strongest STORIES from across all writers - never just one writer's whole submission.
3. Merge stories about the same event into one item, citing all their sources. No topic twice.
4. Where writers conflict, keep only what the cited articles support; if unclear, leave the claim out.
5. Check the recently sent issues (with their send times) if any are listed. Do not repeat a story they \
covered. Include a follow-up only when the cited articles report a material new development since that \
send time, and make the headline say what is new.
6. Write it like a polished long-read article: a specific, compelling title (under 70 characters); \
an intro that works as a 1-2 sentence subtitle summing up the day; 3-4 sections with short headings; \
6-8 items in total, each with a clear headline and a body that reads as flowing prose (what happened, \
then why it matters); and a one-sentence closing thought.
7. If any writer submitted upcoming conferences or events, end with a short section headed \
"Upcoming events" listing them, each with its name, dates and location exactly as the cited \
results state them. Leave out any event whose dates have already passed. These count toward the item total.
8. If any writer submitted news about new apps or major app updates, give it a short section headed \
"Apps", placed before "Upcoming events".

Length is strict: the intro, headings, items and closing together must total $word_min-$word_max \
words (about a 5-minute read). Aim for items of 70-90 words: what happened, then why it matters.
Cite sources only by the article numbers listed; never invent a source, number or quote. \
No hype, no filler, no promotional language. Do not include URLs in the text.

Reply with JSON only, in exactly this shape:
{"rankings": [{"agent": "...", "score": 8, "notes": "one line"}], \
"title": "...", "intro": "...", \
"sections": [{"heading": "...", "items": [{"headline": "...", "body": "...", \
"sources": [3, 7], "from_stories": ["openai-2", "google-1"]}]}], \
"closing": "..."}\
"""

# Sent back when a draft misses the length or item count.
# Placeholders: $words, $items, $repeats_note, $word_min, $word_max, $min_items
revision = """
Your draft body was $words words with $items usable items.$repeats_note \
It must be $word_min-$word_max words with at least $min_items items, each citing listed \
article numbers. Revise and return the complete JSON again.\
"""

# Added to the revision note when items were dropped as repeats. Placeholders: $repeats
repeats_note = " These items were removed because a recent email already covered them: $repeats."
